[project]
name = "rag-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "ocrmac>=1.0.1",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "pypdf>=6.21.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "pre-commit>=3.7"]
office = [
    "odfpy>=1.4.1",
    "python-docx>=1.2.0",
]
rerank = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "transformers>=5.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "BLE001", "T201"]
# BLE001: blind `except Exception` -- the guard hook wants a logger.exception or a `# swallow:` line
# T201:   print() -- library modules log instead

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]
"tools/**" = ["T201"]
"spikes/**" = ["T201"]
"tests/**" = ["T201"]
"**/cli.py" = ["T201"]
"**/__main__.py" = ["T201"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]
